# Klokka API. Every environment-specific value is an env var named KLOKKA_*; the defaults here are for the
# dev and test profiles only. Production (%prod) has no defaults for secrets: a missing variable fails startup.

quarkus.application.name=klokka-api
quarkus.http.port=8080
# 8081 (the Quarkus test default) is taken on this host by a VS Code server.
%test.quarkus.http.test-port=0
# The contract's `servers: [{url: /v1}]`. Health stays at /q/health/*, the spec at /q/openapi.
quarkus.rest.path=/v1
quarkus.http.root-path=/

# ---- database: PostgreSQL 18, Flyway owns the schema (V1__schema.sql), Hibernate only validates it ----
quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.jdbc.url=${KLOKKA_DB_URL}
%prod.quarkus.datasource.username=${KLOKKA_DB_USER}
%prod.quarkus.datasource.password=${KLOKKA_DB_PASSWORD}
# Dev Services (dev and test): a postgres:18 container, zero config. To use the compose database instead, export
# QUARKUS_DATASOURCE_JDBC_URL, QUARKUS_DATASOURCE_USERNAME and QUARKUS_DATASOURCE_PASSWORD before quarkus:dev
# (an empty jdbc url is not "absent" to Agroal, so no ${VAR:} default here).
quarkus.datasource.devservices.image-name=postgres:18-alpine
quarkus.datasource.devservices.db-name=klokka
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.log.sql=false

quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration
# Staging and production run migrations as the DDL-owning role, the app as the runtime role.
%prod.quarkus.flyway.username=${KLOKKA_DB_MIGRATE_USER}
%prod.quarkus.flyway.password=${KLOKKA_DB_MIGRATE_PASSWORD}

# ---- auth: Logto bearer JWTs (docs/DECISIONS.md D1) ----
# Discovery is off so the three values are explicit and the API needs no network to start; keys are fetched
# from the JWKS URL on the first request and refreshed by kid.
quarkus.oidc.application-type=service
quarkus.oidc.auth-server-url=${KLOKKA_AUTH_ISSUER:https://logto.invalid/oidc}
quarkus.oidc.discovery-enabled=false
quarkus.oidc.jwks-path=${KLOKKA_AUTH_JWKS:https://logto.invalid/oidc/jwks}
quarkus.oidc.jwks.resolve-early=false
quarkus.oidc.token.issuer=${KLOKKA_AUTH_ISSUER:https://logto.invalid/oidc}
quarkus.oidc.token.audience=${KLOKKA_AUTH_AUDIENCE:https://api.klokka.invalid}
# A token minted without `resource=` is opaque: reject it outright instead of introspecting.
quarkus.oidc.token.allow-opaque-token-introspection=false
quarkus.oidc.token.allow-jwt-introspection=false
# The global platform-admin role arrives in the `roles` claim.
quarkus.oidc.roles.role-claim-path=roles
quarkus.keycloak.devservices.enabled=false
# Every JAX-RS endpoint must carry @Authenticated, @RolesAllowed or @PermitAll; an unannotated one is denied.
quarkus.security.jaxrs.deny-unannotated-endpoints=true

# Logto Management API (M2M) for invitations and organizations; off until configured (E1).
quarkus.oidc-client.client-enabled=false
%prod.quarkus.oidc-client.client-enabled=true
%prod.quarkus.oidc-client.auth-server-url=${KLOKKA_AUTH_ISSUER}
%prod.quarkus.oidc-client.discovery-enabled=false
%prod.quarkus.oidc-client.token-path=${KLOKKA_AUTH_ISSUER}/token
%prod.quarkus.oidc-client.client-id=${KLOKKA_LOGTO_M2M_CLIENT_ID}
%prod.quarkus.oidc-client.credentials.secret=${KLOKKA_LOGTO_M2M_CLIENT_SECRET}
%prod.quarkus.oidc-client.grant.type=client
%prod.quarkus.oidc-client.grant-options.client.resource=https://default.logto.app/api
%prod.quarkus.oidc-client.grant-options.client.scope=all

# ---- mail: Mailpit locally (mock in tests), Migadu on staging and production ----
quarkus.mailer.from=${KLOKKA_MAIL_FROM:Klokka <no-reply@klokka.invalid>}
quarkus.mailer.host=${KLOKKA_MAIL_HOST:localhost}
quarkus.mailer.port=${KLOKKA_MAIL_PORT:1025}
quarkus.mailer.mock=true
%dev.quarkus.mailer.mock=false
%prod.quarkus.mailer.mock=false
%prod.quarkus.mailer.username=${KLOKKA_MAIL_USERNAME}
%prod.quarkus.mailer.password=${KLOKKA_MAIL_PASSWORD}
%prod.quarkus.mailer.start-tls=${KLOKKA_MAIL_START_TLS:REQUIRED}

# ---- jobs ----
%test.quarkus.scheduler.enabled=false

# ---- OpenAPI: serve the contract verbatim (from the contract jar's META-INF/openapi.yaml), no scanning ----
mp.openapi.scan.disable=true
quarkus.smallrye-openapi.path=/q/openapi

# ---- klokka.* knobs (config/KlokkaConfig.java validates them at startup) ----
klokka.web-base-url=${KLOKKA_WEB_BASE_URL:http://localhost:3000}
klokka.default-language=sv
klokka.invitation.lifetime=P7D
klokka.entries.batch-max=500
klokka.entries.range-max-days=62
klokka.push.quiet-window=PT10M
klokka.push.max-delay=PT30M
klokka.push.batch-size=100
klokka.push.expo-access-token=${KLOKKA_EXPO_ACCESS_TOKEN:}
klokka.mail.monthly-quota=${KLOKKA_MAIL_MONTHLY_QUOTA:100}
klokka.digest.local-hour=7
klokka.logto.endpoint=${KLOKKA_LOGTO_ENDPOINT:https://logto.invalid}
klokka.logto.webhook-signing-key=${KLOKKA_LOGTO_WEBHOOK_SIGNING_KEY:}

# ---- logging ----
quarkus.log.level=INFO
quarkus.log.category."com.prasannjeet.klokka".level=DEBUG
%prod.quarkus.log.category."com.prasannjeet.klokka".level=INFO
