        sent:
          type: integer
          example: 1284
        delivered:
          type: integer
          example: 1267
        failed:
          type: integer
          example: 17
        failedPercent:
          type: number
          example: 1.3
      example:
        sent: 1284
        delivered: 1267
        failed: 17
        failedPercent: 1.3
    OperatorInAppVolume:
      type: object
      required: [created, readWithinDayPercent]
      properties:
        created:
          type: integer
          example: 1301
        readWithinDayPercent:
          type: number
          example: 84
      example:
        created: 1301
        readWithinDayPercent: 84
    OperatorCoalescing:
      type: object
      required: [sittings, entryChanges]
      properties:
        sittings:
          type: integer
          description: Notifications produced by coalescing.
          example: 412
        entryChanges:
          type: integer
          description: Entry changes that went into them.
          example: 1906
      example:
        sittings: 412
        entryChanges: 1906
    OperatorVolumeDay:
      type: object
      required: [date, push, inApp]
      properties:
        date:
          type: string
          format: date
          example: '2026-09-25'
        push:
          type: integer
          example: 61
        inApp:
          type: integer
          example: 63
      example:
        date: '2026-09-25'
        push: 61
        inApp: 63
    OperatorVolumeKind:
      type: object
      required: [kind, count]
      properties:
        kind:
          $ref: '#/components/schemas/NotificationKind'
        count:
          type: integer
          example: 1104
      example:
        kind: HOURS_CHANGED
        count: 1104
    OperatorVolume:
      type: object
      required: [month, email, push, inApp, coalescing, perDay, byKind]
      properties:
        month:
          type: string
          example: '2026-09'
        email:
          $ref: '#/components/schemas/OperatorEmailVolume'
        push:
          $ref: '#/components/schemas/OperatorPushVolume'
        inApp:
          $ref: '#/components/schemas/OperatorInAppVolume'
        coalescing:
          $ref: '#/components/schemas/OperatorCoalescing'
        perDay:
          type: array
          items:
            $ref: '#/components/schemas/OperatorVolumeDay'
        byKind:
          type: array
          items:
            $ref: '#/components/schemas/OperatorVolumeKind'
      example:
        month: '2026-09'
        email:
          sent: 43
          quota: 100
          invitations: 24
          verifications: 11
          digests: 8
          bounced: 0
          resetsOn: '2026-10-01'
          sameMonthLastMonth: 51
          digestOptIns: 2
          digestMondays: 4
        push:
          sent: 1284
          delivered: 1267
          failed: 17
          failedPercent: 1.3
        inApp:
          created: 1301
          readWithinDayPercent: 84
        coalescing:
          sittings: 412
          entryChanges: 1906
        perDay:
          - date: '2026-09-24'
            push: 58
            inApp: 60
          - date: '2026-09-25'
            push: 61
            inApp: 63
        byKind:
          - kind: HOURS_CHANGED
            count: 1104
          - kind: ENTRY_FLAGGED
            count: 41
          - kind: FLAG_RESOLVED
            count: 39
          - kind: INVITE_ACCEPTED
            count: 22
          - kind: MONTH_CLOSED
            count: 95
    OperatorDependency:
      type: object
      required: [name, status, checkedAt]
      properties:
        name:
          type: string
          example: postgres
        status:
          $ref: '#/components/schemas/HealthStatus'
        latencyMs:
          type: [integer, 'null']
          example: 3
        detail:
          type: [string, 'null']
          example: PostgreSQL 18.6, 12 connections
        checkedAt:
          type: string
          format: date-time
          example: '2026-09-27T14:07:00Z'
      example:
        name: postgres
        status: UP
        latencyMs: 3
        detail: PostgreSQL 18.6, 12 connections
        checkedAt: '2026-09-27T14:07:00Z'
    OperatorDeploy:
      type: object
      required: [app, version, deployedAt]
      properties:
        app:
          type: string
          example: klokka-api
        version:
          type: string
          example: 0.1.0-3f9c1a2
        deployedAt:
          type: string
          format: date-time
          example: '2026-09-27T09:12:00Z'
      example:
        app: klokka-api
        version: 0.1.0-3f9c1a2
        deployedAt: '2026-09-27T09:12:00Z'
    OperatorHealth:
      type: object
      required: [status, version, checkedAt, uptimeSeconds, dependencies, recentDeploys]
      properties:
        status:
          $ref: '#/components/schemas/HealthStatus'
        version:
          type: string
          description: The API's version and short commit.
          example: 0.1.0-3f9c1a2
        checkedAt:
          type: string
          format: date-time
          example: '2026-09-27T14:07:00Z'
        uptimeSeconds:
          type: integer
          example: 17520
        dependencies:
          type: array
          items:
            $ref: '#/components/schemas/OperatorDependency'
        recentDeploys:
          type: array
          items:
            $ref: '#/components/schemas/OperatorDeploy'
      example:
        status: UP
        version: 0.1.0-3f9c1a2
        checkedAt: '2026-09-27T14:07:00Z'
        uptimeSeconds: 17520
        dependencies:
          - name: postgres
            status: UP
            latencyMs: 3
            detail: PostgreSQL 18.6, 12 connections
            checkedAt: '2026-09-27T14:07:00Z'
          - name: logto
            status: UP
            latencyMs: 41
            detail: JWKS fetched 4 minutes ago
            checkedAt: '2026-09-27T14:07:00Z'
          - name: expo-push
            status: UP
            latencyMs: 120
            detail: last receipt check 9 minutes ago
            checkedAt: '2026-09-27T14:07:00Z'
          - name: smtp
            status: UP
            latencyMs: 210
            detail: smtp.migadu.com:587 STARTTLS
            checkedAt: '2026-09-27T14:07:00Z'
        recentDeploys:
          - app: klokka-api
            version: 0.1.0-3f9c1a2
            deployedAt: '2026-09-27T09:12:00Z'
          - app: klokka-web
            version: 0.1.0-3f9c1a2
            deployedAt: '2026-09-27T09:14:00Z'

    # ------------------------------------------------------------ webhooks
    LogtoWebhookEvent:
      type: object
      description: A Logto hook payload. Only `hookId`, `event`, `createdAt` and `data` are read; the rest is kept as is.
      required: [hookId, event, createdAt]
      additionalProperties: true
      properties:
        hookId:
          type: string
          example: hook_klokka
        event:
          type: string
          description: Logto event name, for example `User.Deleted` or `Organization.Membership.Updated`.
          example: Organization.Membership.Updated
        createdAt:
          type: string
          format: date-time
          example: '2026-09-27T14:07:00Z'
        data:
          type: object
          additionalProperties: true
          example:
            organizationId: org_cafe_nord
            userId: usr_maria
      example:
        hookId: hook_klokka
        event: Organization.Membership.Updated
        createdAt: '2026-09-27T14:07:00Z'
        data:
          organizationId: org_cafe_nord
          userId: usr_maria
