            weekStart: MONDAY
            memberCount: null
            employerName: Nora Lind
            hoursThisMonth: 92.5
            unreadNotifications: 2
          - workspaceId: 6d5e4f3a-2b1c-4d0e-9f8a-7b6c5d4e3f2a
