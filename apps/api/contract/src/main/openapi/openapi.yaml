openapi: 3.1.0
info:
  title: Klokka API
  version: 0.1.0
  summary: Hours per employee per day, both sides see the month add up.
  description: |
    The ONE contract between the Klokka API and its two clients (web and mobile). Every byte that crosses the
    boundary is defined here first; the Quarkus server interfaces and the typescript-fetch client are generated
    from this file (docs/DECISIONS.md D13). docs/CONTRACT.md is the plain-language index.

    Conventions
    - Dates are ISO 8601 (`2026-09-27`), months are `yyyy-MM`, timestamps are RFC 3339 in UTC.
    - Hours are numbers with at most two decimals (`22.5`), 0 to 24. Money is a number in the workspace
      currency's major unit with two decimals (`3825.00`); money fields are `null` whenever the workspace has
      `showPay` off or the caller may not see the rate.
    - Ids are UUIDs, except the Logto user id (`usr_...`) which is a string.
    - Authorization: one Logto access token per user (audience = the Klokka API resource). Which workspaces a
      user belongs to, and with which role, is decided by the API's own `membership` table, never by token
      claims (D1). Operator routes require the global Logto role `platform-admin` (`roles` claim).
    - Language: every localized string in a response (notification titles, problem messages) uses the language
      stored in the user's preferences. The public invitation lookup takes a `lang` query instead.
    - Errors are RFC 9457 `application/problem+json` with a stable machine `code` (ProblemCode). Every
      operation may also answer `401`, `403` and `500` in that shape.
    - Totals, trends and projections are computed by the API (D9); both clients render these numbers as is.
  license:
    name: MIT
    url: https://github.com/prasannjeet/klokka/blob/main/LICENSE
  contact:
    name: Klokka
    url: https://github.com/prasannjeet/klokka

servers:
  - url: /v1
    description: Relative to the API host (locally http://localhost:8080/v1; the web app calls it through its BFF at /api/k).

security:
  - bearerAuth: []

tags:
  - name: me
    description: The signed-in user, their preferences and push tokens. Available to every authenticated user.
  - name: workspaces
    description: A workspace is one business (a Logto organization). Settings are changed by its employer.
  - name: members
    description: Employer and employees of a workspace, invitations included.
  - name: invitations
    description: The invite link flow. The lookup is public (token in the URL); accepting needs a signed-in user.
  - name: entries
    description: Hours per member per day. Written by the employer, read by the employer and by the member themselves.
  - name: months
    description: Month lock, summary and CSV export.
  - name: insights
    description: Read models for the dashboards. Every number both clients show comes from here (D9).
  - name: flags
    description: An employee flags an entry they think is wrong; the employer fixes or dismisses it.
  - name: notifications
    description: The in-app notification centre; push carries the same items.
  - name: operator
    description: The hosted-instance console. Aggregates only, requires the platform-admin role.
  - name: webhooks
    description: Inbound webhooks (Logto). Signed, no bearer token.

paths:
  # ---------------------------------------------------------------- me
  /me:
    get:
      tags: [me]
      operationId: getMe
      summary: Who am I, what do I prefer, which workspaces am I in
      description: |
        Creates the `app_user` row on first call (default language from the `Accept-Language` header, or Swedish),
        refreshes `last_seen_at`, and returns the user's memberships with the figures the workspace switcher shows.
      responses:
        '200':
          description: The signed-in user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      tags: [me]
      operationId: updateMe
      summary: Change my display name or avatar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserProfileUpdate'
      responses:
        '200':
          description: The updated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Problem'

  /me/preferences:
    patch:
      tags: [me]
      operationId: updateMyPreferences
      summary: Change language, push, digest or theme preference
      description: Fields left out are unchanged. Language changes apply to every later notification (D2).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreferencesUpdate'
      responses:
        '200':
          description: The stored preferences.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preferences'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Problem'

  /me/push-tokens:
    post:
      tags: [me]
      operationId: registerPushToken
      summary: Register this device's Expo push token
      description: Idempotent per token. A token that moves to another user is re-assigned (tokens are per device install).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushTokenRegistration'
      responses:
        '204':
          description: Registered.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Problem'

  /me/push-tokens/{token}:
    parameters:
      - name: token
        in: path
        required: true
        description: The Expo push token, URL-encoded.
        schema:
          type: string
          maxLength: 200
          example: ExponentPushToken[xxxxxxxxxxxxxxxxxxxxxx]
    delete:
      tags: [me]
      operationId: deletePushToken
      summary: Forget a push token (sign-out on that device)
      responses:
        '204':
          description: Forgotten (also when it was unknown).
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Problem'

  # ---------------------------------------------------------------- workspaces
  /workspaces:
    post:
      tags: [workspaces]
      operationId: createWorkspace
      summary: Create a workspace (the caller becomes its employer)
      description: Creates the Logto organization, the employer membership and the workspace row in one transaction.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceCreate'
      responses:
        '201':
          description: The new workspace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Problem'

  /workspaces/{workspaceId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [workspaces]
      operationId: getWorkspace
      summary: Workspace settings (any member)
      responses:
        '200':
          description: The workspace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      tags: [workspaces]
      operationId: updateWorkspace
      summary: Change settings (employer only)
      description: Settings save one field at a time; fields left out are unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceUpdate'
      responses:
        '200':
          description: The updated workspace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'

  # ---------------------------------------------------------------- members
  /workspaces/{workspaceId}/members:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [members]
      operationId: listMembers
      summary: Members of the workspace with their month figures
      description: |
        Employers see everyone with rates (when pay is on). Employees see names, avatars and statuses only:
        `hourlyRate`, `month.earnings` and `invitation` are `null` for members other than themselves.
      parameters:
        - name: status
          in: query
          description: Filter by membership status.
          schema:
            $ref: '#/components/schemas/MemberStatus'
        - $ref: '#/components/parameters/MonthQuery'
      responses:
        '200':
          description: Members, employer first, then by display name.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Member'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'
    post:
      tags: [members]
      operationId: inviteMember
      summary: Invite an employee (employer only)
      description: |
        Creates the membership as INVITED and sends the Logto organization invitation email (7 day lifetime, D3).
        Hours can be logged for an invited member right away. `409 CONFLICT` when the email already belongs to
        a member of this workspace.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberInvite'
      responses:
        '201':
          description: The invited member.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Problem'

  /workspaces/{workspaceId}/members/{membershipId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/MembershipId'
    get:
      tags: [members]
      operationId: getMember
      summary: One member (employer, or the member themselves)
      parameters:
        - $ref: '#/components/parameters/MonthQuery'
      responses:
        '200':
          description: The member.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      tags: [members]
      operationId: updateMember
      summary: Change name, rate or status (employer only)
      description: |
        `status` may move ACTIVE to DEACTIVATED and back. An INVITED member cannot be activated here (that
        happens when they accept). The employer's own membership cannot be deactivated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberUpdate'
      responses:
        '200':
          description: The updated member.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      tags: [members]
      operationId: removeMember
      summary: Revoke a pending invitation or remove a member (employer only)
      description: |
        An INVITED member is removed outright and the Logto invitation revoked. An ACTIVE or DEACTIVATED member
        with entries is not deleted but deactivated (their hours stay visible to both sides); one without entries
        is removed. `409` when the target is the employer.
      responses:
        '204':
          description: Removed or deactivated.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Problem'

  /workspaces/{workspaceId}/members/{membershipId}/invitation/resend:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/MembershipId'
    post:
      tags: [members]
      operationId: resendInvitation
      summary: Send the invitation email again (employer only)
      description: Costs one email. Only for INVITED members; the expiry moves 7 days forward.
      responses:
        '200':
          description: The member with the refreshed invitation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Problem'

  # ---------------------------------------------------------------- invitations
  /invitations/{token}:
    parameters:
      - $ref: '#/components/parameters/InvitationToken'
    get:
      tags: [invitations]
      operationId: getInvitation
      summary: What the join page shows before sign-in (public)
      description: |
        No bearer token: the invitation token in the URL is the secret. Returns the workspace name, colour and
        emoji, who invited, the invited email, the role and the expiry. `404` for an unknown token; an expired or
        accepted one is returned with its `status`, so the page can say so. `lang` picks the language of
        `localized` texts.
      security: []
      parameters:
        - name: lang
          in: query
          description: Language for the localized texts in the response. Defaults to Swedish.
          schema:
            $ref: '#/components/schemas/Language'
      responses:
        '200':
          description: The invitation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'

  /invitations/{token}/accept:
    parameters:
      - $ref: '#/components/parameters/InvitationToken'
    post:
      tags: [invitations]
      operationId: acceptInvitation
      summary: Accept an invitation as the signed-in user
      description: |
        Repeat-safe: accepting an invitation this user already accepted returns `200` again. The signed-in
        user's email must equal the invited email (`403 INVITATION_EMAIL_MISMATCH`). `410 INVITATION_EXPIRED`
        after 7 days. On success the membership becomes ACTIVE, the Logto invitation is accepted through the
        Management API and the employer is notified.
      responses:
        '200':
          description: The membership that was activated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationAccepted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          description: The invitation has expired.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'

  # ---------------------------------------------------------------- entries
  /workspaces/{workspaceId}/entries:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [entries]
      operationId: listEntries
      summary: Entries in a date range (week grid, day lists)
      description: |
        Employers get every member; employees get their own entries only, whatever `membershipId` says.
        Soft-deleted entries are not returned. At most 62 days per call.
      parameters:
        - name: from
          in: query
          required: true
          description: First date, inclusive.
          schema:
            type: string
            format: date
            example: '2026-09-21'
        - name: to
          in: query
          required: true
          description: Last date, inclusive.
          schema:
            type: string
            format: date
            example: '2026-09-27'
        - name: membershipId
          in: query
          description: Only this member's entries.
          schema:
            type: string
            format: uuid
            example: 5f1d2a3c-9b7e-4c1a-8d2f-6e4b1a0c9d21
      responses:
        '200':
          description: Entries ordered by member, then date.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Entry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'

  /workspaces/{workspaceId}/members/{membershipId}/entries/{date}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/MembershipId'
      - $ref: '#/components/parameters/WorkDate'
    put:
      tags: [entries]
      operationId: upsertEntry
      summary: Set the hours for one member and day (employer only; the phone's quick add)
      description: |
        Creates or replaces the entry for `(membershipId, date)`; the previous value goes to the history and the
        member is notified (coalesced per sitting). Hours are rounded by the workspace rule. `409 MONTH_LOCKED`
        when the month is closed, `409 MEMBER_NOT_ACTIVE` for a deactivated member.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntryUpsert'
      responses:
        '200':
          description: The stored entry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      tags: [entries]
      operationId: deleteEntry
      summary: Remove the hours for one member and day (employer only)
      description: Soft delete; the history keeps the value and the member is told. `204` also when there was nothing.
      responses:
        '204':
          description: Removed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Problem'

  /workspaces/{workspaceId}/entries/batch:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [entries]
      operationId: batchUpsertEntries
      summary: Save a week grid in one write (employer only, D8)
      description: |
        Applies every item atomically: `hours` set means upsert, `hours` null means remove. One sitting, so each
        affected member gets one coalesced notification. The whole batch is refused with `409 MONTH_LOCKED` if
        any item falls in a closed month, and with `400` if any item is invalid (the problem lists them).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntryBatchRequest'
      responses:
        '200':
          description: What was saved and removed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntryBatchResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Problem'

  /workspaces/{workspaceId}/entries/{entryId}/history:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/EntryId'
    get:
      tags: [entries]
      operationId: getEntryHistory
      summary: Who changed what, when (employer, or the entry's member)
      responses:
        '200':
          description: Changes, newest first, flags included.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EntryChange'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'

  # ---------------------------------------------------------------- months
  /workspaces/{workspaceId}/months/{month}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/MonthPath'
    get:
      tags: [months]
      operationId: getMonth
      summary: Lock status of a month (any member)
      responses:
        '200':
          description: The month.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonthStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'

  /workspaces/{workspaceId}/months/{month}/lock:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/MonthPath'
    put:
      tags: [months]
      operationId: lockMonth
      summary: Close the month (employer only)
      description: Repeat-safe. Every member is notified once. Entries in the month refuse edits until unlocked.
      responses:
        '200':
          description: The month, now locked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonthStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      tags: [months]
      operationId: unlockMonth
      summary: Reopen the month (employer only)
      description: Repeat-safe. The lock history keeps who locked and unlocked when; members are notified.
      responses:
        '200':
          description: The month, now open.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonthStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'

  /workspaces/{workspaceId}/months/{month}/summary:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/MonthPath'
    get:
      tags: [months]
      operationId: getMonthSummary
      summary: Totals per member, per week and for the workspace (employer only)
      responses:
        '200':
          description: The summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonthSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'

  /workspaces/{workspaceId}/months/{month}/export.csv:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/MonthPath'
    get:
      tags: [months]
      operationId: exportMonthCsv
      summary: CSV of a month, whole workspace or one member
      description: |
        Employers export the workspace or any member; employees export themselves only. UTF-8 with BOM, `;`
        separated (opens cleanly in Swedish Excel), one row per entry: date, weekday, member, hours, note, and
        rate and amount when pay is on. `Content-Disposition` names the file `klokka-<slug>-<month>.csv`.
      parameters:
        - name: membershipId
          in: query
          description: Only this member.
          schema:
            type: string
            format: uuid
            example: 5f1d2a3c-9b7e-4c1a-8d2f-6e4b1a0c9d21
      responses:
        '200':
          description: The CSV.
          content:
            text/csv:
              schema:
                type: string
                example: "date;weekday;member;hours;note\n2026-09-21;Monday;Maria Lind;4;Counter\n"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'

  # ---------------------------------------------------------------- read models
  /workspaces/{workspaceId}/members/{membershipId}/months/{month}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/MembershipId'
      - $ref: '#/components/parameters/MonthPath'
    get:
      tags: [insights]
      operationId: getMemberMonth
      summary: 'One member''s month: every day, the total, the average, vs last month (employer or the member)'
      description: The calendar heat-map and the day list on both clients render this as is.
      responses:
        '200':
          description: The month read model.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberMonth'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'

  /workspaces/{workspaceId}/insights:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [insights]
      operationId: getWorkspaceInsights
      summary: The employer dashboard in one call (employer only)
      description: |
        Total hours, vs the same point last month, projection, per member, week by week, weekday distribution,
        busiest day, nothing-logged days, labour cost when pay is on, and the current week strip for the phone's
        home screen. `month` defaults to the current month in the workspace time zone.
      parameters:
        - $ref: '#/components/parameters/MonthQuery'
      responses:
        '200':
          description: The insights.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceInsights'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'

  /workspaces/{workspaceId}/members/{membershipId}/insights:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/MembershipId'
    get:
      tags: [insights]
      operationId: getMemberInsights
      summary: The employee dashboard and share card figures (employer or the member)
      parameters:
        - $ref: '#/components/parameters/MonthQuery'
      responses:
        '200':
          description: The insights.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberInsights'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'

  # ---------------------------------------------------------------- flags
  /workspaces/{workspaceId}/entries/{entryId}/flags:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/EntryId'
    post:
      tags: [flags]
      operationId: raiseFlag
      summary: Flag an entry as wrong (the entry's member only)
      description: One open flag per entry (`409 FLAG_ALREADY_OPEN`). The employer is notified.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlagCreate'
      responses:
        '201':
          description: The open flag.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Flag'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Problem'

  /workspaces/{workspaceId}/flags:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [flags]
      operationId: listFlags
      summary: 'Flags in the workspace (employer: all; employee: their own)'
      parameters:
        - name: status
          in: query
          description: Filter by status. Defaults to all.
          schema:
            $ref: '#/components/schemas/FlagStatus'
      responses:
        '200':
          description: Flags, open first, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Flag'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'

  /workspaces/{workspaceId}/flags/{flagId}/resolve:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/FlagId'
    post:
      tags: [flags]
      operationId: resolveFlag
      summary: Fix the entry or dismiss the flag (employer only)
      description: |
        `FIX` sets the entry to `hours` (history kept, month lock respected) and marks the flag FIXED; `DISMISS`
        keeps the entry and marks the flag DISMISSED. Either way the member is notified. `409` when the flag is
        already resolved or the month is locked.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlagResolve'
      responses:
        '200':
          description: The resolved flag.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Flag'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Problem'

  # ---------------------------------------------------------------- notifications
  /notifications:
    get:
      tags: [notifications]
      operationId: listNotifications
      summary: My notification centre, newest first
      description: Titles and bodies are localized in my stored language. Cursor paging; `unreadCount` is over the whole filter.
      parameters:
        - name: workspaceId
          in: query
          description: Only this workspace.
          schema:
            type: string
            format: uuid
            example: 2b1f7e0a-4c8d-4d5e-9a6b-3c2d1e0f9a8b
        - name: unreadOnly
          in: query
          schema:
            type: boolean
            default: false
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of notifications.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Problem'

  /notifications/{notificationId}/read:
    parameters:
      - $ref: '#/components/parameters/NotificationId'
    post:
      tags: [notifications]
      operationId: markNotificationRead
      summary: Mark one notification as read
      responses:
        '204':
          description: Marked (also when it already was).
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'

  /notifications/read-all:
    post:
      tags: [notifications]
      operationId: markAllNotificationsRead
      summary: Mark every notification as read, optionally in one workspace
      parameters:
        - name: workspaceId
          in: query
          schema:
            type: string
            format: uuid
            example: 2b1f7e0a-4c8d-4d5e-9a6b-3c2d1e0f9a8b
      responses:
        '204':
          description: Marked.
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Problem'

  # ---------------------------------------------------------------- operator (platform-admin)
  /operator/workspaces:
    get:
      tags: [operator]
      operationId: operatorListWorkspaces
      summary: Workspaces on the hosted instance, counts and dates only
      x-klokka-role: platform-admin
      parameters:
        - name: q
          in: query
          description: Search by name or slug.
          schema:
            type: string
            maxLength: 100
        - name: pay
          in: query
          description: Only workspaces with pay on or off.
          schema:
            type: boolean
        - $ref: '#/components/parameters/MonthQuery'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: sort
          in: query
          description: Sort key, prefix `-` for descending.
          schema:
            type: string
            enum: [name, -name, members, -members, hours, -hours, created, -created, activity, -activity]
            default: -activity
      responses:
        '200':
          description: A page plus the headline figures.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorWorkspacePage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Problem'

  /operator/users:
    get:
      tags: [operator]
      operationId: operatorListUsers
      summary: People signed in through Logto, with membership counts
      x-klokka-role: platform-admin
      parameters:
        - name: q
          in: query
          description: Search by name or email.
          schema:
            type: string
            maxLength: 100
        - name: role
          in: query
          description: Only users who are an employer or an employee somewhere.
          schema:
            $ref: '#/components/schemas/Role'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: A page of users.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorUserPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Problem'

  /operator/invitations:
    get:
      tags: [operator]
      operationId: operatorListInvitations
      summary: Invitations and what they cost in email
      x-klokka-role: platform-admin
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/InvitationStatus'
        - $ref: '#/components/parameters/MonthQuery'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: A page of invitations plus the headline figures.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorInvitationPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Problem'

  /operator/invitations/{invitationId}/resend:
    parameters:
      - name: invitationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
          example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
    post:
      tags: [operator]
      operationId: operatorResendInvitation
      summary: Resend a pending invitation (the console's only mutating action)
      x-klokka-role: platform-admin
      responses:
        '204':
          description: Sent.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Problem'

  /operator/volume:
    get:
      tags: [operator]
      operationId: operatorVolume
      summary: Email against the quota, push, in-app and coalescing figures for a month
      x-klokka-role: platform-admin
      parameters:
        - $ref: '#/components/parameters/MonthQuery'
      responses:
        '200':
          description: The volume figures.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorVolume'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Problem'

  /operator/health:
    get:
      tags: [operator]
      operationId: operatorHealth
      summary: What the API depends on and how it is doing
      x-klokka-role: platform-admin
      responses:
        '200':
          description: Health, dependencies, recent deploys.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorHealth'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Problem'

  # ---------------------------------------------------------------- webhooks
  /webhooks/logto:
    post:
      tags: [webhooks]
      operationId: logtoWebhook
      summary: Logto membership and user events (signed, no bearer)
      description: |
        Logto signs the raw body with HMAC-SHA256 using the hook's signing key and sends it in
        `logto-signature-sha-256`. An invalid signature is `401 INVALID_SIGNATURE`. Events are applied
        idempotently (`hookId` + `createdAt` as the key): organization membership changes mirror into
        `membership`, user deletions deactivate memberships.
      security: []
      parameters:
        - name: logto-signature-sha-256
          in: header
          required: true
          description: Hex HMAC-SHA256 of the raw request body.
          schema:
            type: string
            example: 3f9c1a2b4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5d6e7f8
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogtoWebhookEvent'
      responses:
        '204':
          description: Accepted (also for events Klokka does not act on).
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Problem'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        A Logto access token for the Klokka API resource (`aud` = KLOKKA_AUTH_AUDIENCE, issued by
        KLOKKA_AUTH_ISSUER). Web clients never hold it: the BFF adds it. Mobile requests it with
        `resource=` on every authorize, exchange and refresh (without it Logto issues an opaque token, which
        the API rejects with 401).

  parameters:
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
        example: 2b1f7e0a-4c8d-4d5e-9a6b-3c2d1e0f9a8b
    MembershipId:
      name: membershipId
      in: path
      required: true
      schema:
        type: string
        format: uuid
        example: 5f1d2a3c-9b7e-4c1a-8d2f-6e4b1a0c9d21
    EntryId:
      name: entryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
        example: 9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d
    FlagId:
      name: flagId
      in: path
      required: true
      schema:
        type: string
        format: uuid
        example: 1e0f9a8b-7c6d-4e5f-9a3b-2c1d0e9f8a7b
    NotificationId:
      name: notificationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
        example: 0f9a8b7c-6d5e-4f4a-8b3c-2d1e0f9a8b7c
    InvitationToken:
      name: token
      in: path
      required: true
      description: The opaque invitation token from the email link.
      schema:
        type: string
        minLength: 16
        maxLength: 128
        example: inv_9f8e7d6c5b4a3f2e1d0c9b8a7f6e5d4c
    WorkDate:
      name: date
      in: path
      required: true
      description: The work date in the workspace time zone.
      schema:
        type: string
        format: date
        example: '2026-09-23'
    MonthPath:
      name: month
      in: path
      required: true
      description: The month as `yyyy-MM`.
      schema:
        type: string
        pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
        example: '2026-09'
    MonthQuery:
      name: month
      in: query
      required: false
      description: The month as `yyyy-MM`. Defaults to the current month in the workspace time zone.
      schema:
        type: string
        pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
        example: '2026-09'
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from the previous page's `nextCursor`.
      schema:
        type: string
        maxLength: 200
        example: eyJjIjoiMjAyNi0wOS0yNVQwNzoxNTowMFoiLCJpIjoiMGY5YThiN2MifQ
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 30
    Page:
      name: page
      in: query
      description: 1-based page number.
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 12

  responses:
    Problem:
      description: An error in RFC 9457 shape with a stable `code`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadRequest:
      description: The request is malformed or fails validation; `errors` names the fields.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Bad Request
            status: 400
            code: VALIDATION
            detail: hours must be between 0 and 24
            errors:
              - field: hours
                message: must be less than or equal to 24
    Unauthorized:
      description: No valid bearer token (missing, expired, wrong audience, opaque).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Unauthorized
            status: 401
            code: UNAUTHENTICATED
            detail: A valid bearer token for the Klokka API is required.
    Forbidden:
      description: The caller is not a member with the needed role, or lacks platform-admin.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Forbidden
            status: 403
            code: FORBIDDEN
            detail: Only the employer of this workspace can do that.
    NotFound:
      description: No such resource in a workspace the caller can see.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Not Found
            status: 404
            code: NOT_FOUND
            detail: No member 5f1d2a3c-9b7e-4c1a-8d2f-6e4b1a0c9d21 in this workspace.
    Conflict:
      description: The request is well formed but the resource's state forbids it (locked month, duplicate, already resolved).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Conflict
            status: 409
            code: MONTH_LOCKED
            detail: September 2026 is closed. Unlock it to change entries.

  schemas:
    # ------------------------------------------------------------ errors
    ProblemCode:
      type: string
      description: |
        The stable machine code every error carries. Clients branch on this, never on `detail`, and localize it
        with the `errors.*` keys of the catalogue.
      enum:
        - VALIDATION
        - UNAUTHENTICATED
        - FORBIDDEN
        - NOT_FOUND
        - CONFLICT
        - MONTH_LOCKED
        - MEMBER_NOT_ACTIVE
        - INVITATION_EXPIRED
        - INVITATION_EMAIL_MISMATCH
        - FLAG_ALREADY_OPEN
        - INVALID_SIGNATURE
        - NOT_IMPLEMENTED
        - INTERNAL
      example: MONTH_LOCKED
    Problem:
      type: object
      description: RFC 9457 problem details plus Klokka's `code` and field `errors`.
      required: [title, status, code]
      properties:
        type:
          type: string
          format: uri
          default: about:blank
          example: about:blank
        title:
          type: string
          example: Conflict
        status:
          type: integer
          example: 409
        detail:
          type: string
          description: A developer-facing sentence in English. Not for display; use `code`.
          example: September 2026 is closed. Unlock it to change entries.
        instance:
          type: string
          example: /v1/workspaces/2b1f7e0a-4c8d-4d5e-9a6b-3c2d1e0f9a8b/entries/batch
        code:
          $ref: '#/components/schemas/ProblemCode'
        errors:
          type: array
          description: Field-level problems for `VALIDATION`.
          items:
            $ref: '#/components/schemas/FieldError'
      example:
        type: about:blank
        title: Conflict
        status: 409
        code: MONTH_LOCKED
        detail: September 2026 is closed. Unlock it to change entries.
        instance: /v1/workspaces/2b1f7e0a-4c8d-4d5e-9a6b-3c2d1e0f9a8b/entries/batch
    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          description: JSON pointer-ish path of the offending field (`items[3].hours`).
          example: hours
        message:
          type: string
          example: must be less than or equal to 24
      example:
        field: hours
        message: must be less than or equal to 24

    # ------------------------------------------------------------ enums
    Language:
      type: string
      description: Swedish or English (D16).
      enum: [sv, en]
      example: sv
    ThemePreference:
      type: string
      description: Follow the device, or force light or dark.
      enum: [SYSTEM, LIGHT, DARK]
      example: SYSTEM
    Role:
      type: string
      enum: [EMPLOYER, EMPLOYEE]
      example: EMPLOYEE
    MemberStatus:
      type: string
      enum: [INVITED, ACTIVE, DEACTIVATED]
      example: ACTIVE
    InvitationStatus:
      type: string
      enum: [PENDING, ACCEPTED, EXPIRED, REVOKED]
      example: PENDING
    WeekStart:
      type: string
      enum: [MONDAY, SUNDAY]
      example: MONDAY
    Weekday:
      type: string
      enum: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY]
      example: FRIDAY
    Rounding:
      type: string
      description: Applied when an entry is saved. NONE keeps two decimals, QUARTER rounds to 0.25 h, HALF to 0.5 h.
      enum: [NONE, QUARTER, HALF]
      example: HALF
    WorkspaceColour:
      type: string
      description: One of the workspace colour swatches; the clients map it to design tokens.
      enum: [PRIMARY, BLUE, GREEN, PURPLE, YELLOW, INK]
      example: PRIMARY
    PushPlatform:
      type: string
      enum: [ANDROID, IOS]
      example: ANDROID
    FlagReason:
      type: string
      description: I worked more, I worked less, I was not in.
      enum: [MORE, LESS, NOT_IN]
      example: MORE
    FlagStatus:
      type: string
      enum: [OPEN, FIXED, DISMISSED]
      example: OPEN
    FlagResolutionAction:
      type: string
      enum: [FIX, DISMISS]
      example: FIX
    EntryChangeKind:
      type: string
      enum: [CREATED, UPDATED, DELETED, FLAGGED, FLAG_FIXED, FLAG_DISMISSED]
      example: UPDATED
    NotificationKind:
      type: string
      description: |
        HOURS_CHANGED covers added, changed and removed hours, coalesced per sitting. Employees receive
        HOURS_CHANGED, FLAG_RESOLVED, MONTH_CLOSED and MONTH_REOPENED; employers receive INVITE_ACCEPTED and
        ENTRY_FLAGGED.
      enum: [HOURS_CHANGED, INVITE_ACCEPTED, ENTRY_FLAGGED, FLAG_RESOLVED, MONTH_CLOSED, MONTH_REOPENED]
      example: HOURS_CHANGED
    HealthStatus:
      type: string
      enum: [UP, DEGRADED, DOWN]
      example: UP

    # ------------------------------------------------------------ shared pieces
    Actor:
      type: object
      description: 'Who did something: a user id and the display name to show.'
      required: [userId, name]
      properties:
        userId:
          type: string
          example: usr_nora
        name:
          type: string
          example: Nora Lind
      example:
        userId: usr_nora
        name: Nora Lind
    WeekTotal:
      type: object
      description: Hours in one ISO week (`from` and `to` are clipped to the month).
      required: [isoWeek, from, to, hours]
      properties:
        isoWeek:
          type: integer
          example: 39
        from:
          type: string
          format: date
          example: '2026-09-21'
        to:
          type: string
          format: date
          example: '2026-09-27'
        hours:
          type: number
          example: 113.5
      example:
        isoWeek: 39
        from: '2026-09-21'
        to: '2026-09-27'
        hours: 113.5
    EntryFlagSummary:
      type: object
      description: The open or latest flag on an entry, as shown on a calendar day.
      required: [id, status, reason]
      properties:
        id:
          type: string
          format: uuid
          example: 1e0f9a8b-7c6d-4e5f-9a3b-2c1d0e9f8a7b
        status:
          $ref: '#/components/schemas/FlagStatus'
        reason:
          $ref: '#/components/schemas/FlagReason'
        suggestedHours:
          type: [number, 'null']
          example: 4
      example:
        id: 1e0f9a8b-7c6d-4e5f-9a3b-2c1d0e9f8a7b
        status: OPEN
        reason: MORE
        suggestedHours: 4

    # ------------------------------------------------------------ me
    UserProfile:
      type: object
      required: [id, name, createdAt]
      properties:
        id:
          type: string
          description: The Logto user id (`sub`).
          example: usr_maria
        email:
          type: [string, 'null']
          format: email
          description: Null until the profile has been synced from Logto (the access token carries no email claim by default).
          example: maria.lind@example.com
        name:
          type: string
          example: Maria Lind
        avatarEmoji:
          type: [string, 'null']
          description: An emoji avatar, or null for the initial.
          example: "🐝"
        avatarUrl:
          type: [string, 'null']
          format: uri
          example: null
        createdAt:
          type: string
          format: date-time
          example: '2026-05-12T09:30:00Z'
      example:
        id: usr_maria
        email: maria.lind@example.com
        name: Maria Lind
        avatarEmoji: "🐝"
        avatarUrl: null
        createdAt: '2026-05-12T09:30:00Z'
    UserProfileUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          example: Maria Lind
        avatarEmoji:
          type: [string, 'null']
          maxLength: 16
          description: An empty string clears the emoji (back to the initial); absent or null leaves it unchanged.
          example: "🐝"
      example:
        name: Maria Lind
        avatarEmoji: "🐝"
    Preferences:
      type: object
      required: [language, pushEnabled, digestEnabled, theme]
      properties:
        language:
          $ref: '#/components/schemas/Language'
        pushEnabled:
          type: boolean
          example: true
        digestEnabled:
          type: boolean
          description: The opt-in weekly email digest, off by default.
          example: false
        theme:
          $ref: '#/components/schemas/ThemePreference'
      example:
        language: sv
        pushEnabled: true
        digestEnabled: false
        theme: SYSTEM
    PreferencesUpdate:
      type: object
      properties:
        language:
          $ref: '#/components/schemas/Language'
        pushEnabled:
          type: boolean
          example: true
        digestEnabled:
          type: boolean
          example: false
        theme:
          $ref: '#/components/schemas/ThemePreference'
      example:
        language: en
        digestEnabled: true
    PushTokenRegistration:
      type: object
      required: [token, platform]
      properties:
        token:
          type: string
          description: From `getExpoPushTokenAsync({ projectId })`.
          maxLength: 200
          example: ExponentPushToken[xxxxxxxxxxxxxxxxxxxxxx]
        platform:
          $ref: '#/components/schemas/PushPlatform'
        deviceName:
          type: string
          maxLength: 80
          example: Pixel 8
      example:
        token: ExponentPushToken[xxxxxxxxxxxxxxxxxxxxxx]
        platform: ANDROID
        deviceName: Pixel 8
    MyWorkspace:
      type: object
      description: A membership as the workspace switcher shows it.
      required: [workspaceId, membershipId, name, slug, colour, emoji, role, memberStatus, showPay, currency, timezone, weekStart, hoursThisMonth, unreadNotifications]
      properties:
        workspaceId:
          type: string
          format: uuid
          example: 2b1f7e0a-4c8d-4d5e-9a6b-3c2d1e0f9a8b
        membershipId:
          type: string
          format: uuid
          example: 5f1d2a3c-9b7e-4c1a-8d2f-6e4b1a0c9d21
        name:
          type: string
          example: Café Nord
        slug:
          type: string
          example: cafe-nord
        colour:
          $ref: '#/components/schemas/WorkspaceColour'
        emoji:
          type: string
          example: "☕"
        role:
          $ref: '#/components/schemas/Role'
        memberStatus:
          $ref: '#/components/schemas/MemberStatus'
        showPay:
          type: boolean
          example: true
        currency:
          type: string
          example: SEK
        timezone:
          type: string
          example: Europe/Stockholm
        weekStart:
          $ref: '#/components/schemas/WeekStart'
        memberCount:
          type: [integer, 'null']
          description: Active plus invited members; for employers ("Employer, 4 people").
          example: 4
        employerName:
          type: [string, 'null']
          description: For employees ("Nora Lind logs your hours").
          example: Nora Lind
        hoursThisMonth:
          type: number
          description: The member's own hours this month (employee), or the workspace total (employer).
          example: 92.5
        unreadNotifications:
          type: integer
          example: 2
      example:
        workspaceId: 2b1f7e0a-4c8d-4d5e-9a6b-3c2d1e0f9a8b
        membershipId: 5f1d2a3c-9b7e-4c1a-8d2f-6e4b1a0c9d21
        name: Café Nord
        slug: cafe-nord
        colour: PRIMARY
        emoji: "☕"
        role: EMPLOYEE
        memberStatus: ACTIVE
        showPay: true
        currency: SEK
        timezone: Europe/Stockholm
        weekStart: MONDAY
        memberCount: null
        employerName: Nora Lind
        hoursThisMonth: 92.5
        unreadNotifications: 2
    Me:
      type: object
      required: [user, preferences, workspaces, platformAdmin, pushTokenRegistered]
      properties:
        user:
          $ref: '#/components/schemas/UserProfile'
