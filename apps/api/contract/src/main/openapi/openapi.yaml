        platformAdmin: false
        pushTokenRegistered: true

    # ------------------------------------------------------------ workspaces
    Workspace:
      type: object
      required: [id, name, slug, timezone, currency, weekStart, colour, emoji, showPay, rounding, defaultDayHours, createdAt, memberCount, activeMemberCount]
      properties:
        id:
          type: string
          format: uuid
          example: 2b1f7e0a-4c8d-4d5e-9a6b-3c2d1e0f9a8b
        name:
          type: string
          example: Café Nord
        slug:
          type: string
          description: URL-safe, unique, derived from the name at creation.
          example: cafe-nord
        timezone:
          type: string
          description: IANA time zone; days and weeks are cut by it.
          example: Europe/Stockholm
        country:
          type: [string, 'null']
          description: ISO 3166-1 alpha-2, used for defaults only.
          example: SE
        currency:
          type: string
          description: ISO 4217.
          example: SEK
        weekStart:
          $ref: '#/components/schemas/WeekStart'
        colour:
          $ref: '#/components/schemas/WorkspaceColour'
        emoji:
          type: string
          example: "☕"
        showPay:
          type: boolean
          description: When on, every hours figure gets a money figure and employees see their own rate.
          example: true
        rounding:
          $ref: '#/components/schemas/Rounding'
        defaultDayHours:
          type: number
          description: What the Full day chip fills in.
          example: 7.5
        createdAt:
          type: string
          format: date-time
          example: '2026-05-02T08:00:00Z'
        memberCount:
          type: integer
          description: Active plus invited members, the employer included.
          example: 5
        activeMemberCount:
          type: integer
          example: 4
        myRole:
          $ref: '#/components/schemas/Role'
        myMembershipId:
          type: string
          format: uuid
          example: 3c2d1e0f-9a8b-4c7d-8e6f-5a4b3c2d1e0f
      example:
        id: 2b1f7e0a-4c8d-4d5e-9a6b-3c2d1e0f9a8b
        name: Café Nord
        slug: cafe-nord
        timezone: Europe/Stockholm
        country: SE
        currency: SEK
        weekStart: MONDAY
        colour: PRIMARY
        emoji: "☕"
        showPay: true
        rounding: HALF
        defaultDayHours: 7.5
        createdAt: '2026-05-02T08:00:00Z'
        memberCount: 5
        activeMemberCount: 4
        myRole: EMPLOYER
        myMembershipId: 3c2d1e0f-9a8b-4c7d-8e6f-5a4b3c2d1e0f
    WorkspaceCreate:
      type: object
      required: [name, timezone, currency]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          example: Café Nord
        timezone:
          type: string
          example: Europe/Stockholm
        country:
          type: string
          pattern: '^[A-Z]{2}$'
          example: SE
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          example: SEK
        weekStart:
          $ref: '#/components/schemas/WeekStart'
        colour:
          $ref: '#/components/schemas/WorkspaceColour'
        emoji:
          type: string
          maxLength: 16
          example: "☕"
        showPay:
          type: boolean
          default: false
        rounding:
          $ref: '#/components/schemas/Rounding'
        defaultDayHours:
          type: number
          minimum: 0.5
          maximum: 24
          default: 8
          example: 7.5
      example:
        name: Café Nord
        timezone: Europe/Stockholm
        country: SE
        currency: SEK
        weekStart: MONDAY
        colour: PRIMARY
        emoji: "☕"
    WorkspaceUpdate:
      type: object
      description: Every field optional; a field left out is unchanged.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          example: Café Nord
        timezone:
          type: string
          example: Europe/Stockholm
        country:
          type: string
          pattern: '^[A-Z]{2}$'
          example: SE
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          example: SEK
        weekStart:
          $ref: '#/components/schemas/WeekStart'
        colour:
          $ref: '#/components/schemas/WorkspaceColour'
        emoji:
          type: string
          maxLength: 16
          example: "☕"
        showPay:
          type: boolean
          example: true
        rounding:
          $ref: '#/components/schemas/Rounding'
        defaultDayHours:
          type: number
          minimum: 0.5
          maximum: 24
          example: 7.5
      example:
        showPay: true
        rounding: HALF

    # ------------------------------------------------------------ members
    MemberInvitationState:
      type: object
      description: The pending invitation of an INVITED member.
      required: [status, sentAt, expiresAt, resendCount]
      properties:
        status:
          $ref: '#/components/schemas/InvitationStatus'
        sentAt:
          type: string
          format: date-time
          example: '2026-09-25T10:00:00Z'
        expiresAt:
          type: string
          format: date-time
          example: '2026-10-02T10:00:00Z'
        resendCount:
          type: integer
          example: 0
      example:
        status: PENDING
        sentAt: '2026-09-25T10:00:00Z'
        expiresAt: '2026-10-02T10:00:00Z'
        resendCount: 0
    MemberMonthFigures:
      type: object
      description: The member's figures for the requested month (the Employees table columns).
      required: [month, hours, daysWorked]
      properties:
        month:
          type: string
          example: '2026-09'
        hours:
          type: number
          example: 118
        daysWorked:
          type: integer
          example: 20
        earnings:
          type: [number, 'null']
          description: Null when pay is off or the caller may not see the rate.
          example: 20060
      example:
        month: '2026-09'
        hours: 118
        daysWorked: 20
        earnings: 20060
    Member:
      type: object
      required: [id, workspaceId, displayName, email, role, status, invitedAt, month]
      properties:
        id:
          type: string
          format: uuid
          description: The membership id.
          example: 5f1d2a3c-9b7e-4c1a-8d2f-6e4b1a0c9d21
        workspaceId:
          type: string
          format: uuid
          example: 2b1f7e0a-4c8d-4d5e-9a6b-3c2d1e0f9a8b
        userId:
          type: [string, 'null']
          description: The Logto user id once the invitation is accepted.
          example: usr_maria
        displayName:
          type: string
          example: Maria Lind
        email:
          type: string
          format: email
          example: maria.lind@example.com
        avatarEmoji:
          type: [string, 'null']
          example: "🐝"
        role:
          $ref: '#/components/schemas/Role'
        status:
          $ref: '#/components/schemas/MemberStatus'
        hourlyRate:
          type: [number, 'null']
          description: In the workspace currency. Null when unset, when pay is off, or when the caller may not see it.
          example: 170
        invitedAt:
          type: string
          format: date-time
          example: '2026-05-10T12:00:00Z'
        joinedAt:
          type: [string, 'null']
          format: date-time
          example: '2026-05-12T09:30:00Z'
        invitation:
          $ref: '#/components/schemas/MemberInvitationState'
        month:
          $ref: '#/components/schemas/MemberMonthFigures'
        lastEntryDate:
          type: [string, 'null']
          format: date
          example: '2026-09-25'
      example:
        id: 5f1d2a3c-9b7e-4c1a-8d2f-6e4b1a0c9d21
        workspaceId: 2b1f7e0a-4c8d-4d5e-9a6b-3c2d1e0f9a8b
        userId: usr_maria
        displayName: Maria Lind
        email: maria.lind@example.com
        avatarEmoji: "🐝"
        role: EMPLOYEE
        status: ACTIVE
        hourlyRate: 170
        invitedAt: '2026-05-10T12:00:00Z'
        joinedAt: '2026-05-12T09:30:00Z'
        month:
          month: '2026-09'
          hours: 118
          daysWorked: 20
          earnings: 20060
        lastEntryDate: '2026-09-25'
    MemberInvite:
      type: object
      required: [name, email]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          example: Lina Ahmed
        email:
          type: string
          format: email
          maxLength: 254
          example: lina.ahmed@example.com
        hourlyRate:
          type: number
          minimum: 0
          maximum: 100000
          description: Optional; ignored for display while pay is off but stored.
          example: 160
      example:
        name: Lina Ahmed
        email: lina.ahmed@example.com
        hourlyRate: 160
    MemberUpdate:
      type: object
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 80
          example: Maria Lind
        hourlyRate:
          type: [number, 'null']
          minimum: 0
          maximum: 100000
          description: Absent leaves the rate unchanged; an explicit null clears it.
          example: 175
        status:
          $ref: '#/components/schemas/MemberStatus'
      example:
        hourlyRate: 175

    # ------------------------------------------------------------ invitations
    Invitation:
      type: object
      description: What the public join page shows.
      required: [workspaceName, workspaceEmoji, workspaceColour, inviterName, email, role, status, expiresAt, language]
      properties:
        workspaceName:
          type: string
          example: Café Nord
        workspaceEmoji:
          type: string
          example: "☕"
        workspaceColour:
          $ref: '#/components/schemas/WorkspaceColour'
        inviterName:
          type: string
          example: Nora Lind
        email:
          type: string
          format: email
          description: The invited address, prefilled on the sign-up page.
          example: maria.lind@example.com
        role:
          $ref: '#/components/schemas/Role'
        status:
          $ref: '#/components/schemas/InvitationStatus'
        expiresAt:
          type: string
          format: date-time
          example: '2026-10-02T10:00:00Z'
        language:
          $ref: '#/components/schemas/Language'
        localized:
          type: object
          description: The join page's headline and body in `language`, so the page needs no catalogue before sign-in.
          required: [headline, body]
          properties:
            headline:
              type: string
              example: Nora invited you to Café Nord.
            body:
              type: string
              example: Café Nord logs your hours in Klokka. Set a password and every one of them is yours to see, day by day, month by month.
      example:
        workspaceName: Café Nord
        workspaceEmoji: "☕"
        workspaceColour: PRIMARY
        inviterName: Nora Lind
        email: maria.lind@example.com
        role: EMPLOYEE
        status: PENDING
        expiresAt: '2026-10-02T10:00:00Z'
        language: en
        localized:
          headline: Nora invited you to Café Nord.
          body: Café Nord logs your hours in Klokka. Set a password and every one of them is yours to see, day by day, month by month.
    InvitationAccepted:
      type: object
      required: [workspaceId, membershipId, workspaceName, role]
      properties:
        workspaceId:
          type: string
          format: uuid
          example: 2b1f7e0a-4c8d-4d5e-9a6b-3c2d1e0f9a8b
        membershipId:
          type: string
          format: uuid
          example: 5f1d2a3c-9b7e-4c1a-8d2f-6e4b1a0c9d21
        workspaceName:
          type: string
          example: Café Nord
        role:
          $ref: '#/components/schemas/Role'
      example:
        workspaceId: 2b1f7e0a-4c8d-4d5e-9a6b-3c2d1e0f9a8b
        membershipId: 5f1d2a3c-9b7e-4c1a-8d2f-6e4b1a0c9d21
        workspaceName: Café Nord
        role: EMPLOYEE

    # ------------------------------------------------------------ entries
    Entry:
      type: object
      description: One member's hours on one day. `earnings` is null unless pay is on and the caller may see the rate.
      required: [id, workspaceId, membershipId, memberName, workDate, hours, locked, createdAt, createdBy, updatedAt, updatedBy, changeCount]
      properties:
        id:
          type: string
          format: uuid
          example: 9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d
        workspaceId:
          type: string
          format: uuid
          example: 2b1f7e0a-4c8d-4d5e-9a6b-3c2d1e0f9a8b
        membershipId:
          type: string
          format: uuid
          example: 5f1d2a3c-9b7e-4c1a-8d2f-6e4b1a0c9d21
        memberName:
          type: string
          example: Maria Lind
        workDate:
          type: string
          format: date
          example: '2026-09-23'
        hours:
          type: number
          minimum: 0
          maximum: 24
          example: 6.5
        note:
          type: [string, 'null']
          maxLength: 500
          example: Delivery day, stayed to unload.
        earnings:
          type: [number, 'null']
          example: 1073
        locked:
          type: boolean
          description: True when the entry's month is closed.
          example: false
        flag:
          $ref: '#/components/schemas/EntryFlagSummary'
        createdAt:
          type: string
          format: date-time
          example: '2026-09-23T16:40:00Z'
        createdBy:
          $ref: '#/components/schemas/Actor'
        updatedAt:
          type: string
          format: date-time
          example: '2026-09-24T06:12:00Z'
        updatedBy:
          $ref: '#/components/schemas/Actor'
        changeCount:
          type: integer
          description: Number of history rows (1 for a fresh entry).
          example: 2
      example:
        id: 9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d
        workspaceId: 2b1f7e0a-4c8d-4d5e-9a6b-3c2d1e0f9a8b
        membershipId: 5f1d2a3c-9b7e-4c1a-8d2f-6e4b1a0c9d21
        memberName: Maria Lind
        workDate: '2026-09-23'
        hours: 6.5
        note: Delivery day, stayed to unload.
        earnings: 1073
        locked: false
        createdAt: '2026-09-23T16:40:00Z'
        createdBy:
          userId: usr_nora
          name: Nora Lind
        updatedAt: '2026-09-24T06:12:00Z'
        updatedBy:
          userId: usr_nora
          name: Nora Lind
        changeCount: 2
    EntryUpsert:
      type: object
      required: [hours]
      properties:
        hours:
          type: number
          minimum: 0
          maximum: 24
          description: Two decimals at most; rounded by the workspace rule on save.
          example: 6.5
        note:
          type: [string, 'null']
          maxLength: 500
          description: Null or absent clears the note.
          example: Delivery day, stayed to unload.
      example:
        hours: 6.5
        note: Delivery day, stayed to unload.
    EntryBatchItem:
      type: object
      required: [membershipId, workDate]
      properties:
        membershipId:
          type: string
          format: uuid
          example: 5f1d2a3c-9b7e-4c1a-8d2f-6e4b1a0c9d21
        workDate:
          type: string
          format: date
          example: '2026-09-22'
        hours:
